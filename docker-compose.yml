services:
  server:
    build:
      context: .
      dockerfile: Server/Dockerfile
    ports:
      - "8082:8082"
      - "8083:8083"
      - "${SERVER_PLAIN_GRPC_PORT:-50051}:${SERVER_PLAIN_GRPC_PORT:-50051}"
    env_file:
      - ./Server/.env

  app:
    build:
      context: .
      dockerfile: App/Dockerfile
      args:
        - VITE_SERVER=${VITE_SERVER:-https://floowsynkapi.raenardcruz.com}
    ports:
      - "3000:80"
    environment:
      - VITE_SERVER=${VITE_SERVER:-https://floowsynkapi.raenardcruz.com}
    depends_on:
      - server