services:
  # ─────────────────────────────────────────────
  # Backend server (staging)
  # ─────────────────────────────────────────────
  server-staging:
    build:
      context: .
      dockerfile: Server/Dockerfile
    container_name: floowsynk-server-staging
    ports:
      - "8082:8082"   # gRPC-Web
      - "8083:8083"   # REST API
      - "50051:50051" # Plain gRPC
    env_file:
      - ./Server/.env
    environment:
      - DB_HOST=${DB_HOST:-host.docker.internal}
      - REDIS_HOST=${REDIS_HOST:-host.docker.internal}
      - KAFKA_BROKERS=${KAFKA_BROKERS:-host.docker.internal:9092}
      - APP_ENVIRONMENT=staging
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # Kafka consumer job (staging)
  # ─────────────────────────────────────────────
  consumer-staging:
    build:
      context: .
      dockerfile: Jobs/Consumer/Dockerfile
    container_name: floowsynk-consumer-staging
    env_file:
      - ./Server/.env
    environment:
      - DB_HOST=${DB_HOST:-host.docker.internal}
      - REDIS_HOST=${REDIS_HOST:-host.docker.internal}
      - KAFKA_BROKERS=${KAFKA_BROKERS:-host.docker.internal:9092}
      - APP_ENVIRONMENT=staging
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - server-staging
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # Interval trigger job (staging)
  # ─────────────────────────────────────────────
  interval-staging:
    build:
      context: .
      dockerfile: Jobs/Interval/Dockerfile
    container_name: floowsynk-interval-staging
    env_file:
      - ./Server/.env
    environment:
      - DB_HOST=${DB_HOST:-host.docker.internal}
      - REDIS_HOST=${REDIS_HOST:-host.docker.internal}
      - KAFKA_BROKERS=${KAFKA_BROKERS:-host.docker.internal:9092}
      - SERVER_GRPC_HOST=server-staging
      - APP_ENVIRONMENT=staging
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - server-staging
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # Frontend app (staging)
  # ─────────────────────────────────────────────
  app-staging:
    build:
      context: .
      dockerfile: App/Dockerfile
      args:
        - VITE_SERVER=${VITE_SERVER_STAGING:-http://localhost:8082}
        - VITE_APP_ENVIRONMENT=staging
    container_name: floowsynk-app-staging
    ports:
      - "3000:80"   # http://localhost:3000
    depends_on:
      - server-staging
    restart: unless-stopped
