version: '3.8'

services:
  server:
    build:
      context: .
      dockerfile: Server/Dockerfile
    container_name: floowsynk-server
    ports:
      - "8082:8082"
      - "8083:8083"
      - "${SERVER_PLAIN_GRPC_PORT:-50051}:${SERVER_PLAIN_GRPC_PORT:-50051}"
    env_file:
      - ./Server/.env
    environment:
      - DB_HOST=${DB_HOST:-host.docker.internal}
      - REDIS_HOST=${REDIS_HOST:-host.docker.internal}
      - KAFKA_BROKERS=${KAFKA_BROKERS:-host.docker.internal:9092}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

  consumer:
    build:
      context: .
      dockerfile: Jobs/Consumer/Dockerfile
    container_name: floowsynk-consumer
    env_file:
      - ./Server/.env
    environment:
      - DB_HOST=${DB_HOST:-host.docker.internal}
      - REDIS_HOST=${REDIS_HOST:-host.docker.internal}
      - KAFKA_BROKERS=${KAFKA_BROKERS:-host.docker.internal:9092}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - server
    restart: always

  interval:
    build:
      context: .
      dockerfile: Jobs/Interval/Dockerfile
    container_name: floowsynk-interval
    env_file:
      - ./Server/.env
    environment:
      - DB_HOST=${DB_HOST:-host.docker.internal}
      - REDIS_HOST=${REDIS_HOST:-host.docker.internal}
      - KAFKA_BROKERS=${KAFKA_BROKERS:-host.docker.internal:9092}
      - SERVER_GRPC_HOST=server
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - server
    restart: always
